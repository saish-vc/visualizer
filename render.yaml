services:
  - type: web
    name: codetrace-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NIM_API_KEY
        sync: false
      - key: NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NIM_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: CODETRACE_ALLOWED_ORIGIN
        sync: false

